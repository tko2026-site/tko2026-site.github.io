<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>TKO2026 大会システム</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700;900&display=swap">
<style>
/* 見出しフォント：assets/font/title.otf（または .ttf / .woff2）を置くと自動で差し替わる */
@font-face{font-family:"TitleFont";src:url("assets/font/title.otf"),url("assets/font/title.ttf"),url("assets/font/title.woff2");font-display:swap}

/* レイアウト方針：夜の体育館ステージ。濃紺の地に、黄色のスラッシュと各チーム色で熱量を出す（単一ダークテーマ） */
:root{
  --bg:#0b1024;        /* 地 */
  --bg2:#141b3d;       /* パネル */
  --bg3:#1d2654;       /* 入力欄など */
  --line:#2c3770;      /* 罫線 */
  --fg:#f3f5ff;        /* 文字 */
  --muted:#98a1cc;     /* 補助文字 */
  --gold:#ffd23f;      /* アクセント */
  --red:#ff4057;       /* 警告・VS */
  --ok:#3ddc97;        /* 完了 */
  --f-display:"TitleFont","Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic","Meiryo",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* ===== 画面切替バー ===== */
#modebar{position:sticky;top:0;z-index:50;display:flex;gap:6px;align-items:center;flex-wrap:wrap;
  padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));background:#070b1a;border-bottom:1px solid var(--line)}
#modebar .brand{font-family:var(--f-display);font-size:15px;margin-right:8px;letter-spacing:.04em}
#modebar .brand b{color:var(--gold)}
#modebar a{padding:6px 12px;border-radius:4px;text-decoration:none;color:var(--muted);font-weight:700;font-size:14px}
#modebar a.on{background:var(--gold);color:#111}
#modebar .sp{flex:1}
#modebar .tiny{font-size:12px;color:var(--muted);background:none;border:1px solid var(--line);border-radius:4px;padding:4px 8px}
body.presenting #modebar{display:none}

/* ===== 共通UI ===== */
.wrap{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
.wrap.narrow{max-width:560px}
h1,h2,h3{font-family:var(--f-display);font-weight:400;line-height:1.25;text-wrap:balance;margin:0}
h1{font-size:26px}
h2{font-size:19px}
h3{font-size:16px}
.eyebrow{font-size:12px;letter-spacing:.14em;color:var(--gold);font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13px}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:6px;padding:18px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.btn{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:8px 14px;font-weight:700}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--gold);color:#111;border-color:var(--gold)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.sm{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=password],input[type=number],select,textarea{background:var(--bg3);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
textarea{resize:vertical}
label.fld{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;border:1px solid currentColor}
.pill.ok{color:var(--ok)}.pill.warn{color:var(--gold)}.pill.ng{color:var(--muted)}
.tag-prov{font-size:11px;color:var(--gold);border:1px dashed var(--gold);border-radius:3px;padding:0 5px;margin-left:6px;vertical-align:2px}
.warnbox{border-left:3px solid var(--gold);background:rgba(255,210,63,.08);padding:8px 12px;font-size:13px}
.tscroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:14px}
table.t th,table.t td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
table.t th{font-size:12px;color:var(--muted);font-weight:700}
.tdot{display:inline-block;width:10px;height:10px;border-radius:2px;background:var(--tc);margin-right:6px;vertical-align:0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ok);color:#06210f;font-weight:900;padding:10px 18px;border-radius:4px;z-index:99;animation:toast 2.2s forwards}
@keyframes toast{0%{opacity:0;transform:translate(-50%,10px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0}}

/* チーム画像（ファイルがなければ頭文字の仮表示） */
.timg{position:relative;display:grid;place-items:center;overflow:hidden}
.timg img{width:100%;height:100%;object-fit:contain;position:relative;z-index:1}
.timg .fb{display:none}
.timg.noimg .fb{display:grid;place-items:center;width:78%;aspect-ratio:1;max-height:90%;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc));color:#fff;
  font-family:var(--f-display);font-size:calc(var(--fs,40px));text-shadow:0 2px 0 rgba(0,0,0,.35)}

/* ===== 登録画面 ===== */
.teampick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:480px){.teampick{grid-template-columns:repeat(2,1fr)}}
.teampick button{background:var(--bg2);border:2px solid var(--line);border-radius:6px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.teampick button.sel{border-color:var(--tc);box-shadow:inset 0 0 0 1px var(--tc);background:color-mix(in srgb,var(--tc) 18%,var(--bg2))}
.teampick .timg{width:56px;height:56px;--fs:22px}
.teamhead{display:flex;gap:14px;align-items:center;padding:14px;border-radius:6px;background:linear-gradient(100deg,color-mix(in srgb,var(--tc) 55%,var(--bg2)),var(--bg2) 70%)}
.teamhead .timg{width:72px;height:72px;--fs:28px;flex:none}
.slot{display:grid;grid-template-columns:92px 1fr;gap:8px;align-items:center}
.slot .lab{font-size:13px;font-weight:700}
.slot .lab small{display:block;font-weight:400;color:var(--muted);font-size:11px;line-height:1.35}
.slot .two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.slot select.dup{border-color:var(--gold)}
.slot .legdesc{grid-column:1/-1;margin:-2px 0 6px;font-size:12px;line-height:1.5;color:var(--muted)}
.slot .baton{display:inline-block;margin-left:8px;padding:0 7px;border:1px solid var(--gold);border-radius:99px;color:var(--gold);font-size:11px;font-weight:700}
.evhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}

/* ===== 管理画面 ===== */
.admintabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px}
.admintabs button{background:none;border:none;border-bottom:3px solid transparent;padding:8px 14px;font-weight:700;color:var(--muted)}
.admintabs button.on{color:var(--fg);border-bottom-color:var(--gold)}
.orderpick{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:560px){.orderpick{grid-template-columns:repeat(2,1fr)}}
.orderpick button{border:1px solid var(--line);background:var(--bg3);border-left:6px solid var(--tc);border-radius:4px;padding:8px;text-align:left;font-weight:700;font-size:14px}
.orderpick button.done{opacity:.35}
.orderpick button .pl{float:right;color:var(--gold);font-family:var(--f-display)}
/* 係用の大きいボタン（借り人・障害物） */
.pad h1{font-size:34px;margin:0}
.padgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.padbtn{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:96px;padding:12px 14px;border-radius:12px;border:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 12%,var(--bg2));color:var(--fg);text-align:left;cursor:pointer}
.padbtn b{font-size:20px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.padbtn small{font-size:14px;color:var(--muted);max-width:55%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.padbtn span{position:absolute;right:12px;bottom:8px;font-weight:900;font-size:26px;color:var(--gold);text-align:right;line-height:1.05}.padbtn span em{display:block;font-style:normal;font-size:15px;color:var(--fg)}
.padbtn.on{background:color-mix(in srgb,var(--tc) 45%,var(--bg2))}
.padbtn:disabled{opacity:.45}
.swatch{font-size:64px;font-weight:900;text-align:center;letter-spacing:.02em}.swatch.stopped{color:var(--gold)}
.btn.big{font-size:24px;padding:18px}
.roundtabs{display:flex;gap:4px;flex-wrap:wrap}
.roundtabs button{min-width:40px;padding:4px 8px;border-radius:4px;border:1px solid var(--line);background:var(--bg3);font-weight:700;font-size:13px}
.roundtabs button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.roundtabs button.full{border-color:var(--ok)}
.match{border:1px solid var(--line);border-radius:6px;padding:12px;background:var(--bg3)}
.match.locked{opacity:.45}
.match .mh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bt{display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center;font-size:13px;padding:4px 0;border-top:1px dashed var(--line)}
.bt .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt .nm.r{text-align:right}
.bt .res{display:flex;gap:3px}
.bt .res button{width:34px;padding:3px 0;border-radius:3px;border:1px solid var(--line);background:var(--bg2);font-size:12px;font-weight:700}
.bt .res button.on{background:var(--gold);color:#111;border-color:var(--gold)}
.score{font-family:var(--f-display);font-size:18px}
.ctrlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ctrlgrid .btn.on{background:var(--gold);color:#111;border-color:var(--gold)}

/* ===== 観戦画面 ===== */
.vhero{padding:18px;border-radius:6px;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,210,63,.06) 22px 26px),var(--bg2);border:1px solid var(--line)}
.vs-mini{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:10px}
.vs-mini .side{display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900}
.vs-mini .timg{width:72px;height:72px;--fs:28px}
.vs-mini .v{font-family:var(--f-display);color:var(--red);font-size:28px}
.rankrow{display:grid;grid-template-columns:34px 30px 1fr auto;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid var(--line)}
.rankrow .rk{font-family:var(--f-display);font-size:18px;text-align:center}
.rankrow .timg{width:30px;height:30px;--fs:13px}
.rankrow.top .rk{color:var(--gold)}
.mlist{display:flex;flex-direction:column;gap:6px}
.mline{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;font-size:14px;padding:6px 8px;background:var(--bg3);border-radius:4px}
.mline .w{font-weight:900;color:var(--gold)}
.mline .l{color:var(--muted)}
.mline .r{text-align:right}

/* ===== 演出画面（1920×1080 を画面に合わせて拡縮） ===== */
#presentRoot{position:fixed;inset:0;background:#000;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;transform-origin:center center;overflow:hidden;
  background:radial-gradient(ellipse at 50% 120%,#24307a 0%,transparent 60%),radial-gradient(ellipse at 50% -20%,#1b2463 0%,transparent 55%),var(--bg)}
#stage .bgimg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
#stage .stripes{position:absolute;inset:-200px;z-index:0;opacity:.5;
  background:repeating-linear-gradient(115deg,transparent 0 60px,rgba(255,255,255,.025) 60px 64px);animation:drift 30s linear infinite}
@keyframes drift{to{transform:translateX(220px)}}
.scene{position:absolute;inset:0;z-index:2}
.sc-title{display:grid;place-items:center;text-align:center}
.sc-title .slash{position:absolute;left:-10%;right:-10%;top:47%;height:190px;background:var(--gold);transform:skewY(-6deg) scaleX(0);transform-origin:left;animation:slashIn .5s .1s cubic-bezier(.2,.9,.2,1) forwards}
.sc-title .tt{position:relative;font-family:var(--f-display);font-size:250px;line-height:1;color:#fff;letter-spacing:.02em;
  -webkit-text-stroke:6px #0b1024;paint-order:stroke fill;text-shadow:12px 12px 0 #0b1024;transform:skewX(-8deg);opacity:0;animation:popIn .6s .45s cubic-bezier(.2,1.6,.4,1) forwards}
.sc-title .st{position:relative;margin-top:28px;display:inline-block;background:#0b1024;color:var(--gold);font-family:var(--f-display);font-size:58px;padding:6px 36px;transform:skewX(-8deg);opacity:0;animation:fadeUp .5s .9s forwards}
.sc-title .logo{position:relative;max-width:1300px;max-height:620px;opacity:0;animation:popIn .7s .3s cubic-bezier(.2,1.4,.4,1) forwards}
.sc-title.haslogo .tt,.sc-title.haslogo .st{display:none}
.sc-title .press{position:absolute;bottom:90px;left:0;right:0;font-family:var(--f-display);font-size:36px;letter-spacing:.3em;color:#fff;animation:blink 1.4s steps(2) infinite}
.sc-title video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:5;background:#000}
@keyframes slashIn{to{transform:skewY(-6deg) scaleX(1)}}
@keyframes popIn{0%{opacity:0;transform:skewX(-8deg) scale(2.4)}100%{opacity:1;transform:skewX(-8deg) scale(1)}}
@keyframes fadeUp{from{opacity:0;transform:skewX(-8deg) translateY(30px)}to{opacity:1;transform:skewX(-8deg) translateY(0)}}
@keyframes blink{50%{opacity:0}}

.band{position:absolute;left:0;top:56px;height:110px;padding:0 80px 0 70px;display:flex;align-items:center;gap:28px;
  background:var(--gold);color:#0b1024;clip-path:polygon(0 0,100% 0,calc(100% - 50px) 100%,0 100%);animation:bandIn .45s cubic-bezier(.2,.9,.2,1) both}
.band .en{font-family:var(--f-display);font-size:64px;letter-spacing:.04em}
.band .ja{font-weight:900;font-size:30px}
@keyframes bandIn{from{transform:translateX(-100%)}to{transform:none}}

.sc-teams .cards{position:absolute;left:90px;right:90px;top:220px;display:grid;grid-template-columns:repeat(4,1fr);gap:34px 30px}
.tcard{position:relative;height:380px;opacity:0;animation:cardIn .5s calc(.25s + var(--i)*.09s) cubic-bezier(.2,1.2,.4,1) forwards;transition:transform .25s,filter .25s}
.tcard .bgc{position:absolute;inset:0;clip-path:polygon(8% 0,100% 0,92% 100%,0 100%);
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 85%,#fff) 0%,var(--tc) 45%,color-mix(in srgb,var(--tc) 55%,#000) 100%)}
.tcard .bgc::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.08) 14px 16px)}
.tcard .timg{position:absolute;left:8%;right:8%;top:10px;bottom:84px;--fs:110px}
.tcard .plate{position:absolute;left:4%;right:4%;bottom:14px;height:62px;background:#0b1024;clip-path:polygon(4% 0,100% 0,96% 100%,0 100%);
  display:flex;align-items:center;justify-content:center;font-family:var(--f-display);font-size:36px;color:#fff}
.tcard .no{position:absolute;left:22px;top:6px;font-family:var(--f-display);font-size:30px;color:#fff;-webkit-text-stroke:3px #0b1024;paint-order:stroke fill;z-index:2}
.sc-teams.focusing .tcard{filter:brightness(.4) saturate(.6)}
.sc-teams .tcard.focus{filter:none;transform:scale(1.1);z-index:3}
.sc-teams .tcard.focus .bgc{animation:flash .5s}
.sc-teams .tcard.called:not(.focus){filter:brightness(.75)}
@keyframes cardIn{from{opacity:0;transform:translateY(80px) scale(.8)}to{opacity:1;transform:none}}
@keyframes flash{0%{filter:brightness(3)}100%{filter:brightness(1)}}
.namecall{position:absolute;left:0;right:0;bottom:36px;height:0;z-index:6;pointer-events:none}
.namecall .nc{position:absolute;left:0;right:0;bottom:0;height:150px;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(90deg,transparent,var(--tc) 18%,var(--tc) 82%,transparent);transform:skewY(-3deg);animation:ncIn 1.8s forwards}
.namecall .nc span{font-family:var(--f-display);font-size:110px;color:#fff;-webkit-text-stroke:5px #0b1024;paint-order:stroke fill;letter-spacing:.06em}
@keyframes ncIn{0%{opacity:0;transform:skewY(-3deg) translateX(-30%)}15%{opacity:1;transform:skewY(-3deg) translateX(0)}80%{opacity:1}100%{opacity:0;transform:skewY(-3deg) translateX(10%)}}

/* 演出操作（進行表） */
.ctl{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:16px;align-items:start}
@media (max-width:900px){.ctl{grid-template-columns:1fr}}
.runlist{gap:4px}
.runline{display:flex;gap:6px;align-items:stretch}.runline .runrow{flex:1;min-width:0}
.skipchk{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;padding:0 6px;cursor:pointer}
.runline.skip .runrow{opacity:.35;text-decoration:line-through}
.runrow{display:flex;gap:10px;align-items:center;text-align:left;padding:9px 12px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--fg);font-weight:700;font-size:14px;cursor:pointer}
.runrow .mk{width:18px;flex:none;color:var(--gold)}.runrow.done{color:var(--muted)}.runrow.done .mk{color:var(--ok)}
.runrow.cur{background:var(--gold);color:#111;border-color:var(--gold)}.runrow.cur .mk{color:#111}
.ctlside{position:sticky;top:60px}
.nowbox{padding:12px 14px;border-radius:8px;background:rgba(255,210,63,.1);border:1px solid var(--gold)}.nowlab{font-size:20px;font-weight:900}
.btn.big{font-size:20px;padding:14px 18px}
.adlive{display:block;width:100%;aspect-ratio:16/9;border:0;border-radius:8px;background:#000}
/* 係用：コート入力 */
.cpair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cside{display:flex;flex-direction:column;gap:10px;align-items:stretch;padding:14px;border-radius:10px;border:3px solid var(--tc);background:color-mix(in srgb,var(--tc) 14%,transparent)}
.cnm{font-weight:900;font-size:18px}.csub{font-size:13px;color:var(--muted);margin-top:-6px}.cnum{font-size:64px;font-weight:900;text-align:center;line-height:1}
.cbtns{display:grid;grid-template-columns:1fr 1.4fr;gap:8px}.cbtns .btn{font-size:22px;padding:14px 0}
.cside input{font-size:18px;text-align:center}
/* 演出：人間玉入れ（2コート） */
.sc-tama .courts{position:absolute;left:50px;right:50px;top:200px;height:640px;display:grid;grid-template-columns:1fr 1fr;gap:40px}
.sc-tama .court{display:flex;flex-direction:column;gap:14px}
.sc-tama .cname{font-family:var(--f-display);font-size:48px;color:var(--gold);text-align:center}
.sc-tama .pair{flex:1;display:grid;grid-template-columns:1fr 90px 1fr;align-items:center;gap:10px}
.sc-tama .v{font-family:var(--f-display);font-size:64px;text-align:center;color:#fff;-webkit-text-stroke:3px #0b1024}
.tside{display:flex;flex-direction:column;align-items:center;gap:10px;padding:22px 10px;border-radius:16px;background:#18214d;border:4px solid var(--tc);transition:filter .4s,transform .4s}
.tside .timg{width:170px;height:170px;--fs:70px}.tside b{font-family:var(--f-display);font-weight:400;white-space:nowrap}
.tside small{font-size:24px;color:#c6cdf0}.tside .kago{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 18px;border-radius:10px;background:rgba(255,255,255,.08);max-width:100%}
.tside .kago i{font-style:normal;font-size:20px;font-weight:900;color:var(--gold)}.tside .kago b{font-size:44px;font-weight:900;color:#fff;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}.tside .balls{font-family:var(--f-display);font-size:92px;line-height:1;min-height:92px}.tside .balls.wait{font-size:44px;line-height:92px;color:#9aa6d8}
.tside.win{transform:scale(1.05);box-shadow:0 0 50px var(--tc)}.tside.lose{filter:grayscale(1) brightness(.5)}

<script>
/* =====================================================================
   設定（ここを書き換えればチーム名・色・パスコード・種目・得点が変わる）
   ===================================================================== */
const CONFIG = {
  // データ置き場（Apps Script のウェブアプリURL）。空ならこのブラウザの中だけに保存するデモ動作

  maxMembers: 8,  // 1チームの名簿の最大人数

    // 内部の名前は kehai のまま（旧・気配斬り）。2コート×4試合、各チーム2試合。玉数を入れ、多いほうが勝ち
    kehai:  { name: '人間玉入れ', short: '玉', battles: 1, slot: '籠を背負う人', provisional: true, minutes: 5,
              points: { win: 20, draw: 10, lose: 0 },
              // 企画班の対戦表どおり（同じ番号の試合は2コート同時）
              courts: [
                { name: 'Aコート', matches: [['pikachu', 'kirby'], ['dk', 'yoshi'], ['fox', 'mario'], ['link', 'samus']] },
                { name: 'Bコート', matches: [['fox', 'kirby'], ['link', 'yoshi'], ['pikachu', 'mario'], ['dk', 'samus']] },
              ] },
    quiz:   { name: 'クイズ', max: 100 },
    // その他の追加点（ラジオ体操のベストチーム、当日のファッションポイントなど）。内部の名前は radio のまま
    radio:  { name: 'その他（追加点）', short: '他', points: 10, reasons: ['ラジオ体操', 'ファッション'] },
    relay:  { name: '障害物競走', provisional: true, points: [20, 15, 12, 10, 8, 5, 2, 1],
              // 走る順（企画班のルール文の記載順）。baton は次の走者に渡すもの
              legs: [
                { task: '二人三脚', desc: '2人の足をひもで結んで走る。ひもが解けたらその場で結び直し、転んだらその場からリスタート', people: 2 },
                { task: 'ボトルフリップ', desc: '30秒以内にペットボトルを回転させて床に立てる。できなければ時間が来たら次の走者へ', people: 1 },
                { task: '腕立て伏せ', desc: 'その場で腕立て10回', people: 1 },
                { task: 'ぐるぐるバット', desc: '5回まわって次の走者へ。続けるのが難しいと判断したら、次の走者が30秒待ってから再開', people: 1, baton: 'バット' },
                { task: '風船バッティング', desc: 'バットで風船を打ち、次の走者に取ってもらう（次の走者は動かず腕だけ伸ばす）。落としたらスタート地点から', people: 1, baton: '風船' },
                { task: 'チンチロ', desc: 'お椀にサイコロ2つを投げ、ゾロ目でクリア（お椀の外のゾロ目は無効）', people: 1 },
                { task: '全力疾走', desc: '20m全力で走る', people: 1 },
              ] },
  },
  // 障害物競走の前半・後半の組（1組4チーム）。係のストップウォッチ画面で、その場で変えることもできる
  relayHeats: [['mario', 'link', 'dk', 'yoshi'], ['fox', 'pikachu', 'samus', 'kirby']],
  // 開会式・閉会式のスライドの中身（ここを書き換えれば画面に反映される）
  ceremony: {
    schedule: [['14:45', 'ラジオ体操', 'Aコート'], ['15:00', '人間玉入れ', 'A・Bコート'], ['15:40', '借り人競争', 'Bコート'],
               ['16:35', '障害物競走', 'Bコート'], ['17:00', 'クイズ', 'Bコート'], ['17:30', '閉会式', 'Bコート']],
    prize: ['優勝賞品ございます！'],
    prizeName: 'GODIVA のチョコレート',
    prizeImages: ['assets/prize/godiva1.jpg', 'assets/prize/godiva2.jpg'],  // GitHub には置かない（Mac と Drive の prize フォルダ）
    cautions: ['水分補給しっかり！', '体調が悪くなったら早めに相談！', 'ケガには気をつけて！', 'ゴミは持ち帰る！', '忘れ物に気をつけよう！'],
    party: ['19:30〜 打ち上げ', '詳しくはチャットを見てください'],
    tamaRules: ['相手チームが背負う籠に、たくさん玉を入れよう', 'うちわで相手の邪魔をしに行ってもOK', '玉は全部で30個。全部入れたら、入れ切った時間で勝負',
                '制限時間5分。勝ち20点・引き分け10点・負け0点', '人を攻撃するなど危ない行動はペナルティ・退場'],
    kariruRules: ['はじめは全員起立！ 一度選ばれた人は座る', '全8回、各回1チーム1人がお題に合うメンターを連れてゴール', 'ゴールした順に、インタビューでお題に合っているか確認',
                  '合っていなければ失格（0点）、順位は繰り上げ', '1位20点〜8位1点、チーム全員が選ばれたら +10点'],
  },
  assets: {
    teamImage: id => R(`assets/teams/${id}.png`),
    voice:     id => R(`assets/voice/${id}.mp3`),
    victory:   id => R(`assets/victory/${id}.mp3`),  // 優勝チームの勝利BGM（なければ sfx.win）
    bg:      'assets/bg/B.png',   // 演出の基本の背景
    bgStage: 'assets/bg/A.png',   // タイトル・閉会式・総合順位・優勝の背景
    logo:    'assets/bg/logo.png',
    opening: 'assets/video/opening.mp4',
    sansen:  'assets/video/sansen.mp4',  // 参戦ムービー（Mac版の演出で再生。Drive には置かない）
    breakVideo: 'assets/video/break.mp4', // 休憩画面の背景に音なしで繰り返す映像（なければ背景画像）
    breakBgm:   'assets/bgm/tomoshibi.mp3', // 休憩中に繰り返すBGM（灯火の星）。なければいつものBGMのまま
    sfx: {
      select: 'assets/sfx/select.mp3', vs: 'assets/sfx/vs.mp3', count: 'assets/sfx/count.mp3',
      fight: 'assets/sfx/fight.mp3',
      // 3・2・1・GO! が1本に入った音声。countdownAt は各カウントが鳴る時刻（ミリ秒）
      countdown: 'assets/sfx/countdown.mp3', countdownAt: [0, 1040, 2020, 3000],
      reveal: 'assets/sfx/reveal.mp3', win: 'assets/sfx/win.mp3', timeup: 'assets/sfx/quiz_close.mp3',
      bgm: 'assets/sfx/bgm.mp3',
      page: 'assets/sfx/page.mp3',  // 場面をめくったときの音（voice/sentaku.mp3 から作った）
    },
  },
};

/* =====================================================================
   データ（デモではブラウザ内に保存。本番は Supabase に置き換える）
   ===================================================================== */
const KEY = 'tko2026-demo-v1';
const TEAM = Object.fromEntries(CONFIG.teams.map(t => [t.id, t]));
const EV = CONFIG.events;

function blankState() {
  const s = { rev: 0, locked: false, members: {}, entries: {}, submitted: {},
    results: { kariru: Array.from({ length: EV.kariru.rounds }, () => []), relay: [], quiz: {}, kehai: {}, radio: {}, kariruBonus: {}, bonus: [],
      relayTimes: {}, relayStart: {}, relayStop: {}, relayHeats: CONFIG.relayHeats.map(h => h.slice()) },
    present: { scene: 'title', step: 0, match: null, event: 'total', nonce: 0, skip: {} } };
  for (const t of CONFIG.teams) {
    s.members[t.id] = [];
    s.entries[t.id] = { kariru: Array(EV.kariru.rounds).fill(''), kehai: Array(EV.kehai.battles).fill(''),
      relay: EV.relay.legs.map(l => Array(l.people).fill('')) };
  }
  return s;
}
function normalize(s) {
  // 共有モードでは一部の項目しか保存されていないことがあるので、足りない所を初期値で埋める
  const b0 = blankState();
  s.results = Object.assign(b0.results, s.results || {});
  if (!Array.isArray(s.results.kariru)) s.results.kariru = b0.results.kariru;
  s.results.kariru = Array.from({ length: EV.kariru.rounds }, (_, i) => Array.isArray(s.results.kariru[i]) ? s.results.kariru[i] : []);
  if (!Array.isArray(s.results.relay)) s.results.relay = [];
  s.present = Object.assign(b0.present, s.present || {});
  s.members = s.members || {}; s.entries = s.entries || {}; s.submitted = s.submitted || {};
  s.results.radio = s.results.radio || {}; s.results.kariruBonus = s.results.kariruBonus || {};
  if (!Array.isArray(s.results.bonus)) s.results.bonus = [];
  for (const t of CONFIG.teams) {
    const en = s.entries[t.id] = s.entries[t.id] || {};
    en.kariru = en.kariru || Array(EV.kariru.rounds).fill('');
    en.kehai = Array.from({ length: EV.kehai.battles }, (_, i) => (en.kehai || [])[i] || '');
    const old = Array.isArray(en.relay) ? en.relay : [];
    // 走者の数や人数が変わったときは、同じ番号の枠だけ引き継ぐ
    en.relay = EV.relay.legs.map((l, i) => Array.from({ length: l.people }, (_, j) => (old[i] && old[i][j]) || ''));
    s.members[t.id] = s.members[t.id] || [];
  }
  return s;
}
function loadState() {
  try { const raw = localStorage.getItem(KEY); if (raw) return normalize(Object.assign(blankState(), JSON.parse(raw))); } catch (e) {}
  return blankState();
}
const REMOTE = !!CONFIG.api;
let state = REMOTE ? normalize(blankState()) : loadState();
let bc = null; try { if (!REMOTE) bc = new BroadcastChannel(KEY); } catch (e) {}

/* ---------- 共有モード（Apps Script）----------
   変えた所だけ（パスごと）を送るので、2台が同時に別の所を入力しても消し合わない */
const AUTH_KEY = 'tko2026-auth';
let auth = null; try { auth = JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) {}
function setAuth(a) { auth = a; try { a ? localStorage.setItem(AUTH_KEY, JSON.stringify(a)) : localStorage.removeItem(AUTH_KEY); } catch (e) {} updateNav(); }
const isStaff = () => !REMOTE || (auth && auth.role === 'staff');
let synced = null, serverRev = -1, pending = false, again = false, loaded = !REMOTE, netErr = false;
const clone = o => JSON.parse(JSON.stringify(o));
function diffOps(a, b, path = '', out = []) {
  const obj = x => x && typeof x === 'object' && !Array.isArray(x);
  if (obj(a) && obj(b)) {
    for (const k of new Set([...Object.keys(a), ...Object.keys(b)])) {
      if (!path && k === 'rev') continue;
      const p = path ? `${path}.${k}` : k;
      if (!(k in b)) out.push({ p, d: true });
      else if (!(k in a)) out.push({ p, v: b[k] });
      else diffOps(a[k], b[k], p, out);
    }
  } else if (JSON.stringify(a) !== JSON.stringify(b)) out.push({ p: path, v: b });
  return out;
}
function applyOps(root, ops) {
  for (const op of ops) {
    if (!op.p) { root = op.d ? {} : clone(op.v); continue; }
    const ks = op.p.split('.'); let o = root;
    for (let i = 0; i < ks.length - 1; i++) { if (!o[ks[i]] || typeof o[ks[i]] !== 'object') o[ks[i]] = {}; o = o[ks[i]]; }
    if (op.d) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = clone(op.v);
  }
  return root;
}
async function apiPost(body) {
  const r = await fetch(CONFIG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) });
  return r.json();
}
function adopt(serverState, rev) {
  synced = clone(normalize(Object.assign(blankState(), serverState || {})));
  state = clone(synced); serverRev = rev; loaded = true;
}
async function pushOps() {
  if (pending) { again = true; return; }
  if (isStaff() && loaded) state.scoreboard = eventPoints();  // スプシの「得点」表に書き写す用
  const sent = clone(state), ops = diffOps(synced, sent);
  if (!ops.length) return;
  if (!auth || !synced) { toast('保存するにはログインが必要です'); if (synced) state = clone(synced); rerender(true); return; }
  pending = true;
  try {
    const d = await apiPost({ a: 'ops', role: auth.role, team: auth.team, pass: auth.pass, ops });
    const during = diffOps(sent, JSON.parse(JSON.stringify(state)));  // 送っている間に変えた分
    const before = JSON.stringify(state);
    if (d.state) { adopt(d.state, d.rev); if (during.length) { state = applyOps(state, during); again = true; } }
    if (!d.ok) toast(d.error || '保存できませんでした');
    netErr = false;
    if (!d.ok || JSON.stringify(state) !== before) rerender(true);  // 自分の入力どおりなら描き直さない（操作中の画面が動かないように）
  } catch (e) {
    netErr = true; toast('通信できませんでした。自動でもう一度送ります'); setTimeout(pushOps, 3000);
  }
  pending = false; updateNav();
  if (again) { again = false; pushOps(); }
}
async function pull() {
  if (!REMOTE || pending) return;
  try {
    const r = await fetch(`${CONFIG.api}?a=state&rev=${serverRev}&t=${Date.now()}`); const d = await r.json();
    netErr = false;
    if (d.ok && d.rev !== serverRev && 'state' in d) {
      if (synced && diffOps(synced, JSON.parse(JSON.stringify(state))).length) { pushOps(); return; }  // 未送信の変更が先
      adopt(d.state, d.rev); keepLive(); rerender(true);
    }
  } catch (e) { netErr = true; }
  updateNav();
}
// 読み込みの間隔：運営（管理・演出）2秒、チーム登録5秒、観戦10秒（大人数で開くのでゆっくり）
function pollLoop() { pull().finally(() => setTimeout(pollLoop, { admin: 2000, present: 1500, court: 2000, register: 5000 }[mode()] || 10000)); }

function save() {
  if (REMOTE) { sendLive(); pushOps(); return; }
  state.rev = (state.rev || 0) + 1;
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  try { bc && bc.postMessage(JSON.stringify(state)); } catch (e) {}
}
function onRemote(raw) {
  try { const s = JSON.parse(raw); if ((s.rev || 0) <= (state.rev || 0)) return; state = normalize(Object.assign(blankState(), s)); } catch (e) { return; }
  rerender(true);
}
/* 同じPCの同じブラウザで開いている画面どうし（管理 → 演出など）は、Google を待たずにその場で場面を伝える。
   保存はこれまでどおり Google にも送るので、他のPC・スマホは数秒遅れで追いつく */
const LIVE_KEY = KEY + '-live', TAB_ID = Math.random().toString(36).slice(2);
let liveBc = null, lastLive = null;
try { if (REMOTE) liveBc = new BroadcastChannel(LIVE_KEY); } catch (e) {}
function sendLive() {
  const msg = JSON.stringify({ id: TAB_ID, at: Date.now(), present: state.present });
  try { liveBc && liveBc.postMessage(msg); } catch (e) {}
  try { localStorage.setItem(LIVE_KEY, msg); } catch (e) {}
}
function onLive(raw) {
  let m; try { m = JSON.parse(raw); } catch (e) { return; }
  if (!m || m.id === TAB_ID || !m.present || !loaded) return;
  if (JSON.stringify(state.present) === JSON.stringify(m.present)) return;
  lastLive = { present: m.present, at: Date.now() };
  state.present = JSON.parse(JSON.stringify(m.present));
  if (synced) synced.present = JSON.parse(JSON.stringify(m.present));
  rerender(true);
}
// Google から届いた状態がまだ古い（さっきの「次へ」が保存される前）なら、届いたばかりの場面を優先する
function keepLive() {
  if (!lastLive || Date.now() - lastLive.at > 10000) return;
  if (JSON.stringify(state.present) === JSON.stringify(lastLive.present)) return;
  state.present = JSON.parse(JSON.stringify(lastLive.present));
  if (synced) synced.present = JSON.parse(JSON.stringify(lastLive.present));
}
if (REMOTE) {
  if (liveBc) liveBc.onmessage = e => onLive(e.data);
  window.addEventListener('storage', e => { if (e.key === LIVE_KEY && e.newValue) onLive(e.newValue); });
}
if (!REMOTE) {
  window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) onRemote(e.newValue); });
  if (bc) bc.onmessage = e => onRemote(e.data);
}

/* =====================================================================
   共通ヘルパー
   ===================================================================== */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function timg(t, cls = '') {
  return `<div class="timg ${cls}" style="--tc:${t.color}"><img src="${CONFIG.assets.teamImage(t.id)}" alt="" onerror="this.parentNode.classList.add('noimg');this.remove()"><span class="fb">${esc(t.name[0])}</span></div>`;
}
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2300); }

// 音声：ファイルがなければ何もしない
let muted = false;
const audioCache = {};
/* 素材の場所：PCのファイルから開いたときは assets/ のファイル。
   ネット上（GitHub版）で運営としてログインしたときは、Google ドライブに置いた同じ名前のファイルを使う */
let DRIVE = null; const BLOB = {};
function R(src) {
  if (!DRIVE || !src || !src.startsWith('assets/')) return src;
  const key = src.slice(7); if (BLOB[key]) return BLOB[key];
  const id = DRIVE[key]; if (!id) return src;
  return /\.(png|jpe?g|gif|webp|svg)$/i.test(src) ? `https://lh3.googleusercontent.com/d/${id}` : `https://drive.usercontent.google.com/download?id=${id}&export=download`;
}
async function loadDriveAssets() {
  if (!REMOTE || PREVIEW || location.protocol === 'file:' || DRIVE || !auth || auth.role !== 'staff') return;
  try {
    const d = await apiPost({ a: 'assets', pass: auth.pass });
    if (!d.ok) return;
    // フォルダの入れ方が違っても（assets ごと入れた等）、bgm/ sfx/ voice/ … からの名前でそろえる
    DRIVE = {};
    for (const [k, id] of Object.entries(d.files || {})) DRIVE[k.replace(/^(?:.*\/)?((?:bgm|sfx|voice|victory|teams|bg|video|font)\/[^/]+)$/, '$1')] = id;
    // 演出で使う音と画像は、中身ごと受け取ってこのPCの中に持っておく（本番で鳴るまで待たない・ドライブ側の制限を受けない）
    const want = Object.keys(d.files || {}).filter(k => /^(?:.*\/)?(sfx|voice|victory|teams|bg)\/[^/]+\.(mp3|png|jpe?g|webp)$/i.test(k));
    const type = n => /\.mp3$/i.test(n) ? 'audio/mpeg' : /\.png$/i.test(n) ? 'image/png' : /\.webp$/i.test(n) ? 'image/webp' : 'image/jpeg';
    let got = 0;
    for (let i = 0; i < want.length; i += 12) {
      const r = await apiPost({ a: 'files', pass: auth.pass, names: want.slice(i, i + 12) });
      for (const [n, b64] of Object.entries((r && r.files) || {})) {
        const bin = atob(b64), u8 = new Uint8Array(bin.length); for (let j = 0; j < bin.length; j++) u8[j] = bin.charCodeAt(j);
        const key = n.replace(/^(?:.*\/)?((?:sfx|voice|victory|teams|bg)\/[^/]+)$/, '$1');
        BLOB[key] = URL.createObjectURL(new Blob([u8], { type: type(n) })); got++;
      }
    }
    toast(`演出用の素材をドライブから読み込みました（${got}件）`);
    if (mode() === 'present' || mode() === 'admin') { teardownPresent(); rerender(); }
  } catch (e) { toast('ドライブの素材を読み込めませんでした（音・画像なしで続けます）'); }
}
function play(src, vol = 1) {
  src = R(src);
  if (muted || !src) return;
  try {
    let a = audioCache[src];
    if (a === false) return;
    if (!a) { a = new Audio(src); a.addEventListener('error', () => { audioCache[src] = false; }); audioCache[src] = a; }
    a.currentTime = 0; a.volume = vol; a.play().catch(() => {});
  } catch (e) {}
}

// 人間玉入れの試合（第1試合の1コート・2コート → 第2試合 … の順）
const MATCHES = [];
for (let k = 0; k < 4; k++) EV.kehai.courts.forEach((c, ci) => { const [L, R] = c.matches[k];
  MATCHES.push({ id: `C${ci + 1}-${k + 1}`, round: `第${k + 1}試合`, court: c.name, label: `${c.name} 第${k + 1}試合`, L: () => L, R: () => R }); });
const MDEF = Object.fromEntries(MATCHES.map(m => [m.id, m]));
// 結果 state.results.kehai[id] = { a: 左の玉数, b: 右の玉数, tb: 'L'|'R'|'D'（同数のときの判定） }
function match(id) {
  const d = MDEF[id] || MATCHES[0];
  const L = d.L(), R = d.R(), r = state.results.kehai[d.id] || {};
  const has = v => v !== undefined && v !== null && v !== '';
  const lw = has(r.a) ? Number(r.a) : null, rw = has(r.b) ? Number(r.b) : null;
  let side = null;
  if (lw !== null && rw !== null) side = lw > rw ? 'L' : rw > lw ? 'R' : (r.tb || 'D');
  const tied = lw !== null && lw === rw;
  return { id: d.id, def: d, L, R, battles: [side], lw: lw ?? 0, rw: rw ?? 0, done: !!side, side, tied, ready: true,
    winner: side === 'L' ? L : side === 'R' ? R : null, loser: side === 'L' ? R : side === 'R' ? L : null };
}
function nextMatchId() { const m = MATCHES.find(d => !match(d.id).done); return m ? m.id : MATCHES[MATCHES.length - 1].id; }

function placePoints(order, table) { const p = {}; order.forEach((id, i) => { p[id] = (p[id] || 0) + (table[i] || 0); }); return p; }
function eventPoints() {
  const out = {}; for (const t of CONFIG.teams) out[t.id] = { kariru: 0, kehai: 0, quiz: 0, relay: 0, radio: 0 };
  state.results.kariru.forEach(order => { const p = placePoints(order, EV.kariru.points); for (const id in p) out[id].kariru += p[id]; });
  for (const id in state.results.kariruBonus) if (out[id] && state.results.kariruBonus[id]) out[id].kariru += EV.kariru.bonus;
  state.results.bonus.forEach(b => { if (out[b.team]) out[b.team].radio += Number(b.pt) || 0; });  // 追加点（理由ごとに何件でも）
  const rp = placePoints(state.results.relay, EV.relay.points); for (const id in rp) out[id].relay += rp[id];
  for (const id in state.results.quiz) if (out[id]) out[id].quiz = Math.max(0, Math.min(EV.quiz.max, Number(state.results.quiz[id]) || 0));
  const kp = EV.kehai.points;
  MATCHES.forEach(d => { const m = match(d.id); if (!m.done) return;
    if (m.side === 'D') { out[m.L].kehai += kp.draw; out[m.R].kehai += kp.draw; }
    else { out[m.winner].kehai += kp.win; out[m.loser].kehai += kp.lose; } });
  for (const id in out) out[id].total = out[id].kariru + out[id].kehai + out[id].quiz + out[id].relay + out[id].radio;
  return out;
}
function ranking(ev = 'total') {
  const pts = eventPoints();
  const list = CONFIG.teams.map(t => ({ t, pt: pts[t.id][ev] })).sort((a, b) => b.pt - a.pt);
  list.forEach((r, i) => { r.rank = i > 0 && r.pt === list[i - 1].pt ? list[i - 1].rank : i + 1; });
  return list;
}

function checks(id) {

  const krNames = en.kariru.filter(Boolean);

  return { empty, total: all.length, dupRelay, dupKr };
}

function exportCSV() {

    const en = state.entries[t.id];
    en.kariru.forEach((v, i) => rows.push([t.name, EV.kariru.name, `第${i + 1}回`, v]));

}

// 非表示にした場面は次へ・戻るで飛ばす（行を押せば直接は行ける）
const skipped = i => !!(RUN[i] && (state.present.skip || {})[RUN[i].label]);
function nextRun(from, d) { let i = from + d; while (i >= 0 && i < RUN.length && skipped(i)) i += d; return i >= 0 && i < RUN.length ? i : null; }
function advance(d) {
  const p = state.present;
  if (p.run == null || p.run >= RUN.length) { const i = nextRun(-1, 1); if (i != null) goRun(i); return; }
  if (d > 0) { if (p.step < maxStep()) stepBy(1); else { const i = nextRun(p.run, 1); if (i != null) goRun(i); } }
  else { if (p.step > 0) stepBy(-1); else { const i = nextRun(p.run, -1); if (i != null) goRun(i); } }
}
function adminControl() {
  const p = state.present, cur = p.run != null && p.run < RUN.length ? p.run : -1;  // 進行表が短くなったときの古い位置は無視
  const site = location.href.split('#')[0].split('?')[0];
  $('#atab').innerHTML = `<div class="ctl">
    <section class="panel stack runlist"><div class="evhead"><h2>進行表</h2><span class="muted small">行を押すとその場面へ／「非表示」は次へで飛ばす</span></div>
      ${RUN.map((it, i) => `<div class="runline ${skipped(i) ? 'skip' : ''}"><button type="button" class="runrow ${i === cur ? 'cur' : ''} ${i < cur ? 'done' : ''}" data-run="${i}"><span class="mk">${i < cur ? '✓' : i === cur ? '▶' : ''}</span>${esc(it.label)}</button>
        <label class="skipchk"><input type="checkbox" data-skip="${i}" ${skipped(i) ? 'checked' : ''}>非表示</label></div>`).join('')}</section>
    <section class="panel stack ctlside">
      <div class="nowbox"><div class="eyebrow">いま</div><div class="nowlab">${cur >= 0 ? esc(RUN[cur].label) : '（まだ始まっていません）'}</div><div class="muted small">${esc(cur >= 0 ? stepLabel() : '')}</div></div>
      <div class="row" style="flex-wrap:nowrap"><button class="btn" type="button" id="runPrev" style="flex:1">◀ 戻る</button><button class="btn primary big" type="button" id="runNext" style="flex:2">次へ ▶ <kbd>Space</kbd></button></div>
      <div class="muted small">次へを押すと：${cur < 0 ? esc(RUN[0].label) : p.step < maxStep() ? '同じ場面の続き' : nextRun(cur, 1) != null ? esc(RUN[nextRun(cur, 1)].label) : '（最後です）'}</div>
      <div class="eyebrow" style="margin-top:6px">プロジェクターに映っている画面（音なし）</div>
      <iframe class="adlive" src="${site}?preview=1#present" title="演出画面の確認"></iframe>
      <div class="row small"><a class="btn sm" href="${site}#present" target="_blank" rel="noopener" style="text-decoration:none">演出画面を別ウインドウで開く</a></div>
      <div class="stack small" style="gap:4px"><b>係用の入力画面（運営パスで入る）</b>
        ${EV.kehai.courts.map((c, i) => `<span>${esc(EV.kehai.name)} ${esc(c.name)}：<code>${esc(site)}#court/${i + 1}</code></span>`).join('')}
        <span>${esc(EV.kariru.name)}（順位）：<code>${esc(site)}#kariru</code></span>
        <span>${esc(EV.relay.name)}（ストップウォッチ）：<code>${esc(site)}#relay</code></span></div>
    </section></div>`;
  const at = $('#atab');
  at.querySelectorAll('[data-run]').forEach(b => b.onclick = () => { goRun(+b.dataset.run); adminControl(); });
  at.querySelectorAll('[data-skip]').forEach(c => c.onchange = () => {
    const p = state.present; p.skip = p.skip || {};
    const lab = RUN[+c.dataset.skip].label; if (c.checked) p.skip[lab] = true; else delete p.skip[lab];
    save(); adminControl();
  });
  $('#runNext').onclick = () => { advance(1); adminControl(); };
  $('#runPrev').onclick = () => { advance(-1); adminControl(); };
}
// 演出操作を開いているときは Space で次へ、← で戻る
window.addEventListener('keydown', e => {
  if (mode() !== 'admin' || adminTab !== 'control') return;
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (e.key === ' ' || e.key === 'ArrowRight') { e.preventDefault(); advance(1); adminControl(); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); advance(-1); adminControl(); }
});

/* サンプルデータ（企画班へのデモ用） */
function fillSample() {
  const fam = ['佐藤', '鈴木', '高橋', '田中', '伊藤', '渡辺', '山本', '中村', '小林', '加藤', '吉田', '山田', '松本', '井上'];
  CONFIG.teams.forEach((t, ti) => {
    const names = Array.from({ length: 8 }, (_, i) => `${fam[(ti * 3 + i) % fam.length]} ${'ABCDEFGH'[i]}`);
    state.members[t.id] = names;
    state.entries[t.id] = { kariru: names.slice(0, 8), kehai: names.slice(1, 1 + EV.kehai.battles),
      relay: EV.relay.legs.map((l, i) => l.people === 2 ? [names[i], names[(i + 1) % 8]] : [names[i < 5 ? i : (i + 1) % 8]]) };
    if (ti !== 3) state.submitted[t.id] = Date.now() - ti * 3600e3;
  });
  const shuffle = a => a.map(v => [Math.random(), v]).sort((x, y) => x[0] - y[0]).map(v => v[1]);
  state.results.kariru = state.results.kariru.map((_, i) => i < 5 ? shuffle(CONFIG.teams.map(t => t.id)).slice(0, 7) : []);
  CONFIG.teams.forEach(t => { state.results.quiz[t.id] = 40 + Math.round(Math.random() * 12) * 5; });
  state.results.bonus = [{ label: 'ラジオ体操', team: CONFIG.teams[Math.floor(Math.random() * 8)].id, pt: EV.radio.points }];
  MATCHES.slice(0, 5).forEach(d => { state.results.kehai[d.id] = { a: Math.floor(Math.random() * 15), b: Math.floor(Math.random() * 15) }; });
  state.present.match = MATCHES[5].id;
}

/* =====================================================================
   3. 演出画面（プロジェクター用・1920×1080）
   ===================================================================== */
let P = null; // 演出画面の描画状態 { key, step, timers, seen }
const seenDecided = new Set();
function teardownPresent() { if (P) { stopBreakBgm(); P.timers.forEach(clearTimeout); window.removeEventListener('resize', fitStage); window.removeEventListener('keydown', presentKey); P = null; } }
function later(fn, ms) { const id = setTimeout(fn, ms); P && P.timers.push(id); return id; }
function fitStage() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); const st = $('#stage'); if (st) st.style.transform = `translate(-50%,-50%) scale(${s})`; }

function setScene(sc) { const p = state.present; p.scene = sc; p.step = 0; p.nonce++; if (sc === 'vs' && !p.match) p.match = nextMatchId(); save(); if (mode() === 'present') renderPresent(); }
function maxStep() {
  const p = state.present;
  if (p.scene === 'slide') { const it = curRun(); return it && it.slide && it.slide.type === 'reveal' ? 1 : 0; }
  return { title: 1, teams: CONFIG.teams.length, bracket: 0, vs: EV.kehai.battles, rank: CONFIG.teams.length, tama: 2, kariru: 1, relay: 0, quiz: 0, bonus: 0, tally: 0, finalbars: FB_EVENTS.length + 1 }[p.scene] ?? 0;
}
function stepBy(d) {
  const p = state.present; p.step = Math.max(0, Math.min(maxStep(), p.step + d));
  // 玉入れ：カウントダウンに進めたとき、GO! の瞬間を試合開始時刻にする（どの画面でも同じ残り時間になる）
  if (p.scene === 'tama') { if (p.step === 1 && d > 0) p.timerAt = Date.now() + 900 + CONFIG.assets.sfx.countdownAt[3]; if (p.step === 0) p.timerAt = null; }
  save(); if (mode() === 'present') renderPresent();
}

function presentKey(e) {
  if (e.target.closest && e.target.closest('input,select,textarea')) return;
  if (e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); advance(1); }
  else if (e.key === 'ArrowLeft' || e.key === 'Backspace') { e.preventDefault(); advance(-1); }
  else if (e.key === 'f' || e.key === 'F') { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.())?.catch?.(() => {}); }
  else if (e.key === 'm' || e.key === 'M') { muted = !muted; }
  else if (e.key === 'Escape' && !document.fullscreenElement) { location.hash = '#admin'; }
  showHint();
}
function showHint() { const h = $('#hint'); if (!h) return; h.classList.remove('off'); clearTimeout(showHint.t); showHint.t = setTimeout(() => h.classList.add('off'), 3500); }

function renderPresent() {
  const app = $('#app');
  if (!P) {
    app.innerHTML = `<div id="presentRoot"><div id="stage"><img class="bgimg" id="bgimg" src="${R(CONFIG.assets.bg)}" alt="" onerror="this.style.visibility='hidden'"><div class="bgdim"></div><div class="stripes"></div><div id="scene"></div>
      ${PREVIEW ? '' : '<div class="hint" id="hint">Space：次へ ／ ← 戻る ／ F：全画面 ／ M：消音 ／ Esc：管理へ</div>'}
      ${P_unlocked || PREVIEW ? '' : '<div class="startgate" id="gate"><div>クリックで演出を開始<small>ブラウザの仕様で、一度クリックするまで音が鳴りません</small></div></div>'}</div></div>
      ${PREVIEW ? '' : `<button class="exitbtn" type="button" onclick="location.hash='#admin'">管理画面へ</button>`}`;
    P = { key: null, step: -1, timers: [] };
    if (PREVIEW) muted = true;
    window.addEventListener('resize', fitStage); if (!PREVIEW) window.addEventListener('keydown', presentKey);
    fitStage(); showHint();
    const gate = $('#gate'); if (gate) gate.onclick = () => { P_unlocked = true; gate.remove(); play(CONFIG.assets.sfx.bgm, .35); };
    $('#presentRoot').addEventListener('mousemove', showHint);
  }
  const p = state.present;
  const key = `${p.scene}|${p.match}|${p.event}|${p.round}|${p.nonce}`;
  const sceneEl = $('#scene');
  if (key !== P.key) {
    if (P.key !== null && p.scene !== 'video') play(CONFIG.assets.sfx.page, .9);  // めくった音（開いた直後と動画の場面では鳴らさない）
    P.timers.forEach(clearTimeout); P.timers = [];
    setStageBg();
    stopBreakBgm();
    if (P.bgmHeld && p.scene !== 'video' && p.scene !== 'break') { const b = bgmAudio(); if (b && !muted) b.play().catch(() => {}); P.bgmHeld = false; }
    P.key = key; P.step = -1;
    sceneEl.innerHTML = '';
    ({ title: buildTitle, teams: buildTeams, bracket: buildBracket, vs: buildVS, rank: buildRank, tama: buildTama, kariru: buildKariru, relay: buildRelay, quiz: buildQuiz, bonus: buildBonus, tally: buildTally, finalbars: buildFinal, slide: buildSlide, video: buildVideo, break: buildBreak })[p.scene](sceneEl);
  } else if (p.scene === 'bracket') { buildBracket(sceneEl); }
  else if (p.scene === 'tama') { updateTama(); }
  else if (p.scene === 'kariru') { updateKariru(); }
  else if (p.scene === 'bonus') { buildBonus(sceneEl, true); }
  else if (p.scene === 'vs') { updateLineup(); }
  applyStep(p.step);
}
let P_unlocked = false;

function applyStep(step) {
  const prev = P.step; P.step = step;
  if (prev === step) return;
  const live = prev !== -1 && step === prev + 1;   // 1つ進めたときだけ効果音・アニメーション
  const sc = state.present.scene;
  if (sc === 'title') stepTitle(step, live);
  if (sc === 'teams') stepTeams(step, live);
  if (sc === 'vs') stepVS(step, live);
  if (sc === 'rank') stepRank(step, live, prev);
  if (sc === 'finalbars') stepFinal(step, live);
  if (sc === 'slide') { const m = $('#slMys'), r = $('#slRev');  // 優勝賞品の公開
    if (r) { m.hidden = step >= 1; r.hidden = step < 1; if (step >= 1) { fitText(r); if (live) play(CONFIG.assets.sfx.reveal, .9); } } }
  if (sc === 'tama') stepTama(step, live);
  if (sc === 'kariru') updateKariru(live);
}

/* 人間玉入れ：2コート同時の対戦 */
function tamaMatches(k) { return EV.kehai.courts.map((c, ci) => match(`C${ci + 1}-${k}`)); }
function buildTama(el) {
  const k = state.present.round || 1;
  const side = (id, mid, s) => { const t = TEAM[id]; return `<div class="tside" id="ts_${mid}_${s}" style="--tc:${t.color}">${timg(t)}<b style="font-size:${t.name.length > 5 ? 34 : 44}px">${esc(t.name)}</b>
    <div class="kago"><i>籠を背負う人</i><b>${esc(state.entries[id].kehai[0] || '—')}</b></div><div class="balls num" id="tb_${mid}_${s}"></div></div>`; };
  el.innerHTML = `<div class="scene sc-tama" id="scTama"><div class="band"><span class="en">MATCH ${k}</span><span class="ja">${esc(EV.kehai.name)}　第${k}試合</span></div>
    <div class="courts">${tamaMatches(k).map(m => `<div class="court"><div class="cname">${esc(m.def.court)}</div>
      <div class="pair">${side(m.L, m.id, 'a')}<div class="v">VS</div>${side(m.R, m.id, 'b')}</div></div>`).join('')}</div>
    <div class="tmr num" id="tamaTimer">${EV.kehai.minutes}:00</div><div id="countLayer"></div></div>`;
  later(() => play(CONFIG.assets.sfx.vs, .9), 400);
  tamaTick();
}
function tamaTick() {
  const el = $('#tamaTimer'); if (!el) return;
  const p = state.present, total = EV.kehai.minutes * 60000;
  if (p.timerAt && p.step >= 1) {
    const rem = total - Math.max(0, Date.now() - p.timerAt);
    if (rem > 0) { const s = Math.ceil(rem / 1000); el.textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; el.classList.toggle('low', s <= 30); el.classList.remove('up'); }
    else { el.textContent = 'TIME UP'; el.classList.add('up'); if (P && !P.timeup) { P.timeup = true; if (Date.now() - p.timerAt - total < 3000) play(CONFIG.assets.sfx.timeup); } }
  } else { el.textContent = `${EV.kehai.minutes}:00`; el.classList.remove('low', 'up'); }
  later(tamaTick, 250);
}
function stepTama(step, live) {
  updateTama();
  const layer = $('#countLayer'); if (!layer) return;
  layer.innerHTML = '';
  if (step === 1 && live) {
    const show = inner => { layer.innerHTML = `<div class="count"><div class="bn">READY?</div>${inner}</div>`; };
    const at = CONFIG.assets.sfx.countdownAt, t0 = 900;
    show(''); later(() => play(CONFIG.assets.sfx.countdown), t0);
    ['3', '2', '1'].forEach((n, i) => later(() => show(`<div class="n">${n}</div>`), t0 + at[i]));
    later(() => show(`<div class="fight">GO!</div>`), t0 + at[3]);
    later(() => { layer.innerHTML = ''; }, t0 + at[3] + 1400);
  }
  if (step === 2 && live) later(() => play(CONFIG.assets.sfx.reveal, .8), 200);
}
function updateTama() {
  const p = state.present, show = p.step >= 2;
  tamaMatches(p.round || 1).forEach(m => {
    [['a', m.L, m.lw], ['b', m.R, m.rw]].forEach(([s, id, n]) => {
      const box = $(`#tb_${m.id}_${s}`), sd = $(`#ts_${m.id}_${s}`); if (!box || !sd) return;
      box.textContent = show ? (m.done ? n : '集計中') : ''; box.classList.toggle('wait', show && !m.done);
      sd.classList.toggle('win', show && m.done && m.winner === id); sd.classList.toggle('lose', show && m.done && m.loser === id);
      sd.classList.toggle('draw', show && m.done && m.side === 'D');
    });
  });
}

/* 借り人競争：第○回の出走者と結果 */
function buildKariru(el) {
  const k = state.present.round || 1;
  el.innerHTML = `<div class="scene sc-kariru" id="scKariru"><div class="band"><span class="en">ROUND ${k}</span><span class="ja">${esc(EV.kariru.name)}　第${k}回</span></div>

/* 追加点（ラジオ体操・ファッションポイントなど）：入ったものから順に並べる。新しく入ったものは音つきで出る */

/* 対戦表（人間玉入れ：2コート×4試合） */
function buildBracket(el) {
  const fresh = [];
  const col = c => `<div class="crt"><div class="cname">${esc(c.name)}</div>${MATCHES.filter(d => d.court === c.name).map(d => { const m = match(d.id), L = TEAM[m.L], R = TEAM[m.R];
    const fr = m.done && !seenDecided.has(m.id); if (fr) fresh.push(m.id);
    const cls = id => m.done ? (m.side === 'D' ? 'draw' : m.winner === id ? 'win' : 'lost') : '';
    return `<div class="mrow ${fr ? 'fresh' : ''}"><span class="rd">${d.round}</span>
      <span class="tm ${cls(m.L)}" style="--tc:${L.color}">${timg(L)}<b style="font-size:${L.name.length > 5 ? 26 : 34}px">${esc(L.name)}</b></span>

// 1行に収める：はみ出す文字だけ少しずつ小さくする（フォントの読み込み後にもう一度）
function fitText(root) {
  const run = () => root.querySelectorAll('.fit').forEach(e => {
    e.style.fontSize = ''; let fs = parseFloat(getComputedStyle(e).fontSize), n = 0;

  });
  run(); document.fonts && document.fonts.ready.then(() => { if (root.isConnected) run(); });
}

/* 総合順位発表（棒グラフ）：次へで種目ごとに色の帯が伸び、最後に並べ替えて優勝を出す */
const FB_EVENTS = [
  { k: 'kehai', label: EV.kehai.name, color: '#ff8a3d' },
  { k: 'kariru', label: EV.kariru.name, color: '#3ddc97' },
  { k: 'relay', label: EV.relay.name, color: '#4cc9f0' },
  { k: 'quiz', label: EV.quiz.name, color: '#ffd23f' },
  { k: 'radio', label: EV.radio.name, color: '#b388ff' },
];
const FB_ROW = 96;
function buildFinal(el) {
  const pts = eventPoints(), max = Math.max(1, ...CONFIG.teams.map(t => pts[t.id].total));
  el.innerHTML = `<div class="scene sc-final" id="scFinal"><div class="band"><span class="en">FINAL RESULT</span><span class="ja">総合順位発表</span></div>
    <div class="fb-legend">${FB_EVENTS.map((e, i) => `<span id="fbl${i}"><i style="background:${e.color}"></i>${esc(e.label)}</span>`).join('')}</div>
    <div class="fb-rows">${CONFIG.teams.map((t, i) => `<div class="fbrow" id="fb_${t.id}" style="--tc:${t.color};top:${i * FB_ROW}px">
      <span class="rk"></span>${timg(t)}<span class="nm">${esc(t.name)}</span>
      <div class="track">${FB_EVENTS.map(e => `<div class="seg" style="background:${e.color}"><span class="num">${pts[t.id][e.k] / max >= .05 ? pts[t.id][e.k] : ''}</span></div>`).join('')}</div>
      <span class="tot num">0</span></div>`).join('')}</div>
    <div id="winLayer"></div></div>`;
  P.fb = { pts, max };
}
function countUp(el, from, to, ms) {
  if (from === to) { el.textContent = to; return; }
  const t0 = performance.now();
  const tick = now => { const k = Math.min(1, (now - t0) / ms); el.textContent = Math.round(from + (to - from) * k); if (k < 1 && el.isConnected) requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
}
function stepFinal(step, live) {
  if (!P.fb) return;
  const { pts, max } = P.fb, n = FB_EVENTS.length, shown = Math.min(step, n), done = step > n;
  FB_EVENTS.forEach((e, i) => { const l = $('#fbl' + i); if (l) { l.classList.toggle('on', i < shown); l.classList.toggle('cur', i === shown - 1 && !done); } });
  // 最後の段階だけ点数順に並べ替える（同点は同順位）
  const order = done ? CONFIG.teams.map(t => ({ t, pt: pts[t.id].total })).sort((a, b) => b.pt - a.pt) : CONFIG.teams.map(t => ({ t, pt: 0 }));
  order.forEach((r, i) => { r.rank = done && i > 0 && r.pt === order[i - 1].pt ? order[i - 1].rank : i + 1; });
  order.forEach((r, i) => {
    const row = $('#fb_' + r.t.id); if (!row) return;
    row.style.top = (i * FB_ROW) + 'px';
    row.classList.toggle('first', done && r.rank === 1);
    row.querySelector('.rk').textContent = done ? r.rank : '';
    row.querySelectorAll('.seg').forEach((sg, k) => { sg.style.width = k < shown ? (pts[r.t.id][FB_EVENTS[k].k] / max * 100) + '%' : '0%'; });
    const sum = FB_EVENTS.slice(0, shown).reduce((a, e) => a + pts[r.t.id][e.k], 0), tot = row.querySelector('.tot');
    if (live && !done) countUp(tot, Number(tot.textContent) || 0, sum, 1100); else tot.textContent = sum;
  });
  const wl = $('#winLayer'); if (wl) wl.innerHTML = '';
  if (live && step > 0 && !done) play(CONFIG.assets.sfx.reveal, .8);
  if (done && live && order[0]) {
    play(CONFIG.assets.sfx.reveal, .8);
    const t = order[0].t;
    later(() => {
      const conf = Array.from({ length: 90 }, () => `<i style="left:${Math.random() * 100}%;background:${['#ffd23f', '#ff4057', '#fff', t.color, '#3ddc97'][Math.floor(Math.random() * 5)]};animation-duration:${2.5 + Math.random() * 2.5}s;animation-delay:${Math.random() * 1.2}s"></i>`).join('');
      wl.innerHTML = `<div class="winner" style="--tc:${t.color}"><div class="in">${timg(t)}<div class="lab">WINNER</div><div class="nm">${esc(t.name)}</div></div></div><div class="confetti">${conf}</div>`;
      play(CONFIG.assets.voice(t.id)); later(() => playVictory(t.id), 1200);
      wl.querySelector('.winner').onclick = () => { wl.innerHTML = ''; };  // クリックで棒グラフに戻る
    }, 2600);  // 並べ替えを見せてから
  }
}

  $('#app').querySelectorAll('[data-cr]').forEach(b => b.onclick = () => { courtRound = +b.dataset.cr; renderCourt(); });
  $('#app').querySelectorAll('[data-adj]').forEach(b => b.onclick = () => { const [key, d] = b.dataset.adj.split(':'); const o = rec(); o[key] = Math.max(0, (Number(o[key]) || 0) + Number(d)); o.tb = undefined; save(); renderCourt(); });
  $('#app').querySelectorAll('[data-set]').forEach(i => i.onchange = () => { const o = rec(); o[i.dataset.set] = i.value === '' ? undefined : Math.max(0, Number(i.value)); o.tb = undefined; save(); renderCourt(); });
  $('#app').querySelectorAll('[data-tb]').forEach(b => b.onclick = () => { rec().tb = b.dataset.tb; save(); renderCourt(); });
  clearTimeout(renderCourt.t); if (live === k && p.timerAt) renderCourt.t = setTimeout(() => { if (mode() === 'court' && !(document.activeElement && document.activeElement.matches('input'))) renderCourt(); }, 1000);
}

/* =====================================================================
   係用：借り人競争の順位（#kariru）
   ===================================================================== */
let krPad = null;  // 今見ている回（1〜8、9 は「全員選ばれた」）
function renderKariruPad() {
  const R = EV.kariru.rounds, p = state.present;
  if (krPad == null) krPad = (p.scene === 'kariru' && p.round) || (state.results.kariru.findIndex(o => !o.length) + 1) || R + 1;
  const k = krPad;
  const nav = `<div class="row" style="flex-wrap:nowrap;gap:8px"><button class="btn" type="button" id="kpPrev" style="flex:1" ${k <= 1 ? 'disabled' : ''}>◀ 前の回</button>
    <button class="btn primary" type="button" id="kpNext" style="flex:1" ${k > R ? 'disabled' : ''}>${k >= R ? '全員選ばれたチームへ ▶' : '次の回へ ▶'}</button></div>`;
  let body;
  if (k > R) {
    body = `<div><div class="eyebrow">${esc(EV.kariru.name)}</div><h1>全員選ばれたチーム</h1></div>
      <p class="muted small">チーム全員が誰かに選ばれたチームを押してください（+${EV.kariru.bonus}点）。もう一度押すと外れます。</p>
      <div class="padgrid">${CONFIG.teams.map(t => `<button type="button" class="padbtn ${state.results.kariruBonus[t.id] ? 'on' : ''}" data-kb="${t.id}" style="--tc:${t.color}">
        <b>${esc(t.name)}</b><span>${state.results.kariruBonus[t.id] ? `+${EV.kariru.bonus}` : ''}</span></button>`).join('')}</div>`;
  } else {
    const order = state.results.kariru[k - 1];
    body = `<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${esc(EV.kariru.name)}</div><h1>第${k}回</h1></div>
        <span class="pill">${order.length} / ${CONFIG.teams.length} チーム</span></div>
      <p class="muted small">お題に合っていると確認できたチームを、ゴールした順に押してください。押したチームをもう一度押すと外れて、後ろが繰り上がります。押さなかったチームは0点です。</p>
      <div class="padgrid">${CONFIG.teams.map(t => { const i = order.indexOf(t.id);
        return `<button type="button" class="padbtn ${i >= 0 ? 'on' : ''}" data-kp="${t.id}" style="--tc:${t.color}"><b>${esc(t.name)}</b>
          <small>${esc(state.entries[t.id].kariru[k - 1] || '')}</small><span>${i >= 0 ? `${i + 1}位<em>+${EV.kariru.points[i] || 0}</em>` : ''}</span></button>`; }).join('')}</div>
      <div class="row" style="gap:8px"><button class="btn sm" type="button" id="kpUndo" ${order.length ? '' : 'disabled'}>1つ戻す</button><button class="btn sm" type="button" id="kpClear" ${order.length ? '' : 'disabled'}>この回をやり直す</button></div>`;
  }
  $('#app').innerHTML = `<div class="wrap narrow stack pad"><div class="roundtabs">${Array.from({ length: R }, (_, i) => `<button type="button" data-kr="${i + 1}" class="${i + 1 === k ? 'on' : ''} ${state.results.kariru[i].length ? 'full' : ''}">${i + 1}</button>`).join('')}<button type="button" data-kr="${R + 1}" class="${k > R ? 'on' : ''}">全員</button></div>${body}${nav}</div>`;
  const go = n => { krPad = n; renderKariruPad(); };
  $('#app').querySelectorAll('[data-kr]').forEach(b => b.onclick = () => go(+b.dataset.kr));
  $('#kpPrev').onclick = () => go(Math.max(1, k - 1));
  $('#kpNext').onclick = () => go(Math.min(R + 1, k + 1));
  $('#app').querySelectorAll('[data-kp]').forEach(b => b.onclick = () => {
    const o = state.results.kariru[k - 1], id = b.dataset.kp, i = o.indexOf(id);
    if (i >= 0) o.splice(i, 1); else o.push(id);
    save(); renderKariruPad();
  });
  $('#app').querySelectorAll('[data-kb]').forEach(b => b.onclick = () => { const id = b.dataset.kb; state.results.kariruBonus[id] = !state.results.kariruBonus[id]; save(); renderKariruPad(); });
  const u = $('#kpUndo'); if (u) u.onclick = () => { state.results.kariru[k - 1].pop(); save(); renderKariruPad(); };
  const c = $('#kpClear'); if (c) c.onclick = () => {
    if (c.dataset.armed !== '1') { c.dataset.armed = '1'; c.textContent = 'もう一度押すと消えます'; setTimeout(() => { if (c.isConnected) { c.dataset.armed = ''; c.textContent = 'この回をやり直す'; } }, 3000); return; }
    state.results.kariru[k - 1].length = 0; save(); renderKariruPad();
  };
}

/* =====================================================================
   係用：障害物競走のストップウォッチ（#relay）。前半・後半4チームずつ、タイムで8チームの順位を出す
   ===================================================================== */
let rlTab = null, rlEdit = false, rlTick = null;
function fmtSec(ms) { return ms == null ? '—' : `${Math.floor(ms / 60000)}:${(ms % 60000 / 1000).toFixed(2).padStart(5, '0')}`; }
function relayHeats() { const h = state.results.relayHeats; return Array.isArray(h) && h.length === 2 ? h : CONFIG.relayHeats.map(x => x.slice()); }
function relayRanking() {
  const T = state.results.relayTimes || {};
  return CONFIG.teams.map(t => ({ t, ms: T[t.id] })).sort((a, b) => (a.ms ?? Infinity) - (b.ms ?? Infinity));
}
function renderRelayPad() {
  clearInterval(rlTick);
  const R = state.results, heats = relayHeats();
  R.relayTimes = R.relayTimes || {}; R.relayStart = R.relayStart || {}; R.relayStop = R.relayStop || {};
  if (rlTab == null) rlTab = heats[0].every(id => R.relayTimes[id] != null) ? (heats[1].every(id => R.relayTimes[id] != null) ? 2 : 1) : 0;
  const tabs = `<div class="roundtabs">${['前半', '後半', '順位'].map((n, i) => `<button type="button" data-rt="${i}" class="${rlTab === i ? 'on' : ''}">${n}</button>`).join('')}</div>`;
  let body = '';
  if (rlTab < 2) {
    const h = rlTab, ids = heats[h], st = R.relayStart[h], sp = R.relayStop[h];
    const done = ids.filter(id => R.relayTimes[id] != null).sort((a, b) => R.relayTimes[a] - R.relayTimes[b]);
    if (rlEdit) {
      body = `<h1>${h ? '後半' : '前半'}の組を選ぶ</h1><p class="muted small">走る4チームを押してください（もう片方の組は残りの4チームになります）。</p>
        <div class="padgrid">${CONFIG.teams.map(t => `<button type="button" class="padbtn ${ids.includes(t.id) ? 'on' : ''}" data-rp="${t.id}" style="--tc:${t.color}"><b>${esc(t.name)}</b></button>`).join('')}</div>
        <button class="btn primary" type="button" id="rpDone" ${ids.length === 4 ? '' : 'disabled'}>この組で決定（${ids.length}/4）</button>`;
    } else {
      body = `<div class="row" style="justify-content:space-between"><div><div class="eyebrow">${esc(EV.relay.name)}</div><h1>${h ? '後半' : '前半'}</h1></div>
          <button class="btn sm" type="button" id="rpEdit" ${st ? 'disabled' : ''}>組を変える</button></div>
        <div class="swatch num ${sp ? 'stopped' : ''}" id="rpClock">${st ? fmtSec((sp || Date.now()) - st) : '0:00.00'}</div>
        ${!st ? `<button class="btn primary big" type="button" id="rpStart">スタート</button>`
          : sp ? `<button class="btn big" type="button" id="rpResume">止めたのを取り消す（続きから計る）</button>`
          : `<button class="btn big danger" type="button" id="rpStop">ストップ</button>`}
        <p class="muted small">${!st ? 'スタートの合図と同時に押してください。' : sp ? 'タイマーを止めました。チームのボタンは押せません。' : 'ゴールした順にチームを押してください（押した瞬間のタイムが入ります）。押し間違えたら、もう一度押すと取り消せます。全チームがゴールしたら（または打ち切るときは）ストップ。'}</p>
        <div class="padgrid">${ids.map(id => { const t = TEAM[id], ms = R.relayTimes[id], i = done.indexOf(id);
          return `<button type="button" class="padbtn ${ms != null ? 'on' : ''}" data-rg="${id}" style="--tc:${t.color}" ${st && !sp ? '' : 'disabled'}><b>${esc(t.name)}</b><span>${ms != null ? `${i + 1}着<em class="num">${fmtSec(ms)}</em>` : ''}</span></button>`; }).join('')}</div>
        <button class="btn sm" type="button" id="rpReset" ${st || done.length ? '' : 'disabled'}>この組をやり直す</button>`;
    }
  } else {
    const list = relayRanking(), cur = R.relay || [];
    body = `<div><div class="eyebrow">${esc(EV.relay.name)}</div><h1>8チームの順位（タイム順）</h1></div>
      <div class="mlist">${list.map((r, i) => `<div class="mline"><span><b>${r.ms != null ? i + 1 + '位' : '—'}</b>　<span class="tdot" style="--tc:${r.t.color}"></span>${esc(r.t.name)}</span><span class="score num">${fmtSec(r.ms)}</span><span class="r muted small">${r.ms != null ? `+${EV.relay.points[i] || 0}点` : '記録なし（0点）'}</span></div>`).join('')}</div>
      <button class="btn primary" type="button" id="rpCommit" ${list.some(r => r.ms != null) ? '' : 'disabled'}>この順位で確定する</button>
      <p class="small ${cur.length ? '' : 'muted'}">${cur.length ? `いま結果に入っている順位：${cur.map((id, i) => `${i + 1}位 ${esc(TEAM[id].name)}`).join('　')}` : 'まだ結果に入っていません'}</p>`;
  }
  $('#app').innerHTML = `<div class="wrap narrow stack pad">${tabs}${body}</div>`;
  $('#app').querySelectorAll('[data-rt]').forEach(b => b.onclick = () => { rlTab = +b.dataset.rt; rlEdit = false; renderRelayPad(); });
  const h = rlTab;
  if (rlTab < 2 && !rlEdit) {
    const st = R.relayStart[h];
    if (st && !R.relayStop[h]) rlTick = setInterval(() => { const e = $('#rpClock'); if (!e || mode() !== 'relay') return clearInterval(rlTick); e.textContent = fmtSec(Date.now() - (state.results.relayStart || {})[h]); }, 50);
    const sb = $('#rpStart'); if (sb) sb.onclick = () => { state.results.relayStart[h] = Date.now(); delete state.results.relayStop[h]; save(); renderRelayPad(); };
    const pb = $('#rpStop'); if (pb) pb.onclick = () => { state.results.relayStop[h] = Date.now(); save(); renderRelayPad(); };
    const qb = $('#rpResume'); if (qb) qb.onclick = () => { delete state.results.relayStop[h]; save(); renderRelayPad(); };
    const eb = $('#rpEdit'); if (eb) eb.onclick = () => { rlEdit = true; renderRelayPad(); };
    $('#app').querySelectorAll('[data-rg]').forEach(b => b.onclick = () => {
      const now = Date.now(), r = state.results, id = b.dataset.rg, s0 = r.relayStart[h]; if (!s0 || (r.relayStop || {})[h]) return;
      if (r.relayTimes[id] != null) delete r.relayTimes[id]; else r.relayTimes[id] = now - s0;
      save(); renderRelayPad();
    });
    const rb = $('#rpReset'); if (rb) rb.onclick = () => {
      if (rb.dataset.armed !== '1') { rb.dataset.armed = '1'; rb.textContent = 'もう一度押すとこの組のタイムを消します'; setTimeout(() => { if (rb.isConnected) { rb.dataset.armed = ''; rb.textContent = 'この組をやり直す'; } }, 3000); return; }
      const r = state.results; delete r.relayStart[h]; delete (r.relayStop || {})[h]; relayHeats()[h].forEach(id => delete r.relayTimes[id]); save(); renderRelayPad();
    };
  }
  if (rlTab < 2 && rlEdit) {
    $('#app').querySelectorAll('[data-rp]').forEach(b => b.onclick = () => {
      const hs = relayHeats().map(x => x.slice()), id = b.dataset.rp, mine = hs[h];
      if (mine.includes(id)) mine.splice(mine.indexOf(id), 1); else if (mine.length < 4) mine.push(id);
      hs[1 - h] = CONFIG.teams.map(t => t.id).filter(x => !mine.includes(x));
      state.results.relayHeats = hs; save(); renderRelayPad();
    });
    const d = $('#rpDone'); if (d) d.onclick = () => { rlEdit = false; renderRelayPad(); };
  }
  const cm = $('#rpCommit'); if (cm) cm.onclick = () => {
    state.results.relay = relayRanking().filter(r => r.ms != null).map(r => r.t.id); save(); renderRelayPad(); toast('順位を結果に入れました');
  };
}

/* =====================================================================
   4. 観戦画面（全員用・スマホ想定・閲覧のみ）
   ===================================================================== */
function renderViewer() {
  const nm = match(nextMatchId());
  const mline = m => {
    const L = TEAM[m.L], R = TEAM[m.R], c = id => m.winner ? (m.winner === id ? 'w' : 'l') : '';
    return `<div class="mline"><span class="${c(m.L)}"><span class="tdot" style="--tc:${L.color}"></span>${esc(L.name)}</span><span class="score num">${m.done ? `${m.lw}-${m.rw}` : 'vs'}</span><span class="r ${c(m.R)}">${esc(R.name)}<span class="tdot" style="--tc:${R.color};margin:0 0 0 6px"></span></span></div>`;
  };
  $('#app').innerHTML = `<div class="wrap narrow stack">
    <div><div class="eyebrow">LIVE</div><h1>${esc(CONFIG.eventTitle)} ${esc(CONFIG.eventSubtitle)}</h1><p class="muted small">結果が入ると自動で更新されます。</p></div>
    ${!nm.done ? `<section class="vhero"><div class="eyebrow">次の対戦　${esc(EV.kehai.name)} ${esc(nm.def.label)}</div>
      <div class="vs-mini"><div class="side">${timg(TEAM[nm.L])}${esc(TEAM[nm.L].name)}</div><span class="v">VS</span><div class="side">${timg(TEAM[nm.R])}${esc(TEAM[nm.R].name)}</div></div></section>` : ''}
    <section class="panel stack"><h2>${esc(EV.kehai.name)} 対戦表</h2>
      ${EV.kehai.courts.map(c => `<div class="stack" style="gap:6px"><span class="eyebrow">${esc(c.name)}</span><div class="mlist">${MATCHES.filter(d => d.court === c.name).map(d => mline(match(d.id))).join('')}</div></div>`).join('')}</section>
    <section class="panel stack"><h2>${esc(EV.kariru.name)}</h2>
      <p class="small muted">終了 ${state.results.kariru.filter(o => o.length).length} / ${EV.kariru.rounds} 回</p></section>
  </div>`;
}

$('#staffOut').onclick = () => { setAuth(null); session = null; rerender(); };
updateNav();
rerender();
if (REMOTE) { pollLoop(); loadDriveAssets(); }
</script>
